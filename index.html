<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14232B">
<meta name="description" content="Manood ng mga AI short drama, isang swipe lang.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kalkal</title>
<style>
:root{--bg:#14232B;--card:#1D3340;--ink:#F2EEE6;--mute:#9DB0B8;--acc:#FF7A59;--line:#2B4857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:760px;margin:auto}
h1{font:700 1.9rem Georgia,serif;margin:0;letter-spacing:-.02em}
h3{font:700 1.05rem Georgia,serif;margin:18px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--acc);color:#1a0d08;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.adm{display:none}body.admin .adm{display:inline-block}
main{max-width:760px;margin:auto;padding:4px 16px 70px}
#q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0 4px}
#msg{color:var(--mute);font-size:.85rem;min-height:1px}
.hero{position:relative;border-radius:16px;overflow:hidden;margin:10px 0;aspect-ratio:4/3}
.hp{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.hs{position:absolute;inset:0;background:linear-gradient(transparent 35%,#14232Bee)}
.ht{position:absolute;left:14px;right:14px;bottom:14px}
.ht h2{font:700 1.4rem Georgia,serif;margin:4px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{background:#000a;border-radius:99px;padding:2px 10px;font-size:.75rem}
.hrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.ci{flex:0 0 110px;cursor:pointer}.ci b,.card b{display:block;font-size:.85rem;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
