<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14232B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kalkal</title>
<style>
:root{--bg:#14232B;--card:#1D3340;--ink:#F2EEE6;--mute:#9DB0B8;--acc:#FF7A59;--line:#2B4857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 8px;max-width:760px;margin:auto}
h1{font:700 2.2rem Georgia,serif;margin:0;letter-spacing:-.02em}
h1 small{display:block;font:400 .85rem system-ui;color:var(--mute);letter-spacing:0}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:#1a0d08;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:760px;margin:auto;padding:8px 16px 80px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border-left:4px solid var(--acc)}
.item h2{font:700 1.25rem Georgia,serif;margin:0 0 2px}
.item .g{color:var(--acc);font-size:.85rem}
.item p{margin:8px 0;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.eps button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.meter{color:var(--mute);font-size:.8rem;text-align:center;margin-top:24px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(92vw,520px);padding:18px}
dialog::backdrop{background:#000a}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mute)}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
video{width:100%;border-radius:10px;background:#000;max-height:70vh}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px;display:none}.bar i{display:block;height:100%;width:0;background:var(--acc)}#msg{color:var(--mute);font-size:.85rem;margin:6px 0}.adm{display:none}body.admin .adm{display:inline-block}
#feed{display:none;position:fixed;inset:0;z-index:50;background:#000;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.slide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
.slide video{width:100%;height:100%;object-fit:contain;background:#000}
.cap{position:absolute;left:16px;right:70px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;flex-direction:column;text-shadow:0 1px 6px #000;pointer-events:none}
.cap b{font:700 1.2rem Georgia,serif}.cap span{font-size:.85rem;color:#ddd}
#feed .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:60;width:42px;height:42px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:1.2rem;cursor:pointer}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.item{padding:0!important;margin:0!important;overflow:hidden;border-left:0!important;display:flex;flex-direction:column}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--line);position:relative}
.ph{display:grid;place-items:center;font:700 3.5rem Georgia,serif;background:linear-gradient(160deg,#2B4857,#FF7A59);color:#fff}
.pw{position:relative}.pw[data-a]{cursor:pointer}
.pw[data-a]::after{content:"▶";position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:.9rem}
.in{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.in h2{font-size:1.05rem!important}
.in p{margin:0!important;font-size:.82rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.in .row button,.in .eps button{font-size:.78rem;padding:5px 8px}
.seekw{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;color:#fff;font-size:.75rem;text-shadow:0 1px 4px #000}
.seek{flex:1;height:34px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#ffffff59}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--acc);margin-top:-7px}
.seek::-moz-range-track{height:4px;border-radius:4px;background:#ffffff59}
.seek::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Kalkal<small>Mga AI short drama para sa lahat.</small></h1>
  <div class="row"><button class="btn adm" id="add">Magdagdag</button><button class="btn ghost" id="login">Admin</button></div>
</header>
<main>
  <div class="tabs"><button class="on" data-f="all">Lahat</button><button data-f="fav">Paborito</button></div>
  <div id="msg"></div>
  <div id="list"></div>
</main>

<dialog id="dlgAdd"><form method="dialog" id="frm">
  <h2 style="margin:0 0 4px;font-family:Georgia,serif">Bagong drama</h2>
  <label for="t">Pamagat</label><input id="t" required maxlength="80">
  <label for="g">Genre</label>
  <select id="g"><option>Romance</option><option>Pamilya</option><option>Thriller</option><option>Katatakutan</option><option>Komedya</option><option>Sci-fi</option></select>
  <label for="s">Buod</label><textarea id="s" rows="3" maxlength="300"></textarea>
  <label for="p">Cover (larawan)</label><input id="p" type="file" accept="image/*">
  <label for="v">Mga episode (video, hanggang 100 MB bawat isa)</label><input id="v" type="file" accept="video/*" multiple>
  <div class="bar" id="bar"><i></i></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end">
    <button class="btn ghost" value="cancel" formnovalidate>Kanselahin</button>
    <button class="btn" value="ok">I-save</button>
  </div>
</form></dialog>

<div id="feed" aria-label="Panoorin"></div>

<script>
// Ilagay dito ang URL ng Cloudflare Worker mo (walang / sa dulo)
const API='https://kalkal-api.spaceboy69xxx.workers.dev';

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key=localStorage.getItem('adminKey')||'',filter='all',data=[];
let favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]'));
const msg=t=>$('msg').textContent=t||'';
const auth=()=>({Authorization:'Bearer '+key});

const getList=async()=>{const r=await fetch(API+'/api/dramas',{cache:'no-store'});if(!r.ok)throw new Error('Hindi ma-load ang listahan');return r.json()};
const saveList=async l=>{const r=await fetch(API+'/api/dramas',{method:'PUT',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify(l)});if(!r.ok)throw new Error('Hindi na-save ang listahan ('+r.status+')')};
const delVideo=k=>fetch(API+'/api/video/'+encodeURIComponent(k),{method:'DELETE',headers:auth()});
const upload=(k,f,onp)=>new Promise((res,rej)=>{const x=new XMLHttpRequest();
  x.open('PUT',API+'/api/video/'+encodeURIComponent(k));
  x.setRequestHeader('Authorization','Bearer '+key);x.setRequestHeader('Content-Type',f.type||'video/mp4');
  x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total);
  x.onload=()=>x.status<300?res():rej(new Error('Hindi na-upload ('+x.status+')'));
  x.onerror=()=>rej(new Error('Walang koneksyon'));x.send(f)});
const pick=(acc='video/*',m=true)=>new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=acc;i.multiple=m;i.onchange=()=>res([...i.files]);i.click()});
const shrink=f=>new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const w=Math.min(720,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('Hindi ma-process ang larawan')),'image/jpeg',.82)};img.onerror=()=>rej(new Error('Hindi mabasa ang larawan'));img.src=URL.createObjectURL(f)});
const uploadCover=async(id,f)=>{const k=`${id}-cover-${Date.now()}.jpg`;await upload(k,await shrink(f),()=>{});return k};
const ext=f=>(f.name.split('.').pop()||'mp4').replace(/\W/g,'').toLowerCase();
const bar=p=>{const b=$('bar');b.style.display='block';b.firstElementChild.style.width=Math.round(p*100)+'%'};

async function uploadEps(id,files,start){
  const eps=[];
  for(let i=0;i<files.length;i++){
    const k=`${id}-${Date.now()}-${i}.${ext(files[i])}`;
    msg(`Ina-upload ang ${files[i].name} (${i+1}/${files.length})...`);
    await upload(k,files[i],p=>bar((i+p)/files.length));
    eps.push({key:k,name:files[i].name});
  }
  return eps;
}

async function load(){
  if(API.includes('YOUR-SUBDOMAIN')){msg('Ilagay muna ang Worker URL sa index.html (API).');return}
  try{msg('Naglo-load...');data=await getList();msg('')}catch(e){msg(e.message+'. Subukan ulit mamaya.')}
  render();
}
function render(){
  let d=filter==='fav'?data.filter(x=>favs.has(x.id)):data;
  $('list').innerHTML=d.length?d.map(x=>`
   <article class="item" data-id="${esc(x.id)}">
    <div class="pw"${x.eps.length?' data-a="play" data-i="0"':''}>${x.poster?`<img class="poster" loading="lazy" alt="${esc(x.title)}" src="${API}/api/video/${encodeURIComponent(x.poster)}">`:`<div class="poster ph">${esc((x.title[0]||'K').toUpperCase())}</div>`}</div>
    <div class="in">
     <h2>${esc(x.title)}</h2><div class="g">${esc(x.genre)} · ${x.eps.length} ep</div>
     <p>${esc(x.synopsis||'')}</p>
     <div class="eps">${x.eps.map((e,i)=>`<button data-a="play" data-i="${i}">▶ ${i+1}</button>`).join('')}</div>
     <div class="row">
      <button class="btn ghost" data-a="fav">${favs.has(x.id)?'★':'☆'}</button>
      <button class="btn ghost adm" data-a="up">+ Ep</button>
      <button class="btn ghost adm" data-a="cover">Cover</button>
      <button class="btn ghost adm" data-a="del">Burahin</button>
     </div>
    </div>
   </article>`).join(''):'<div class="empty" style="grid-column:1/-1">Wala pang drama dito.</div>';
}

$('list').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.closest('.item').dataset.id,d=data.find(x=>x.id===id);
  try{
    if(b.dataset.a==='fav'){favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('favs',JSON.stringify([...favs]))}
    if(b.dataset.a==='play'){openFeed(id,+b.dataset.i);return}
    if(b.dataset.a==='up'){
      const f=await pick();if(!f.length)return;
      const eps=await uploadEps(id,f);data=await getList();
      const t=data.find(x=>x.id===id);t.eps.push(...eps);await saveList(data);msg('Na-upload na.');setTimeout(msg,2500);
    }
    if(b.dataset.a==='cover'){
      const [f]=await pick('image/*',false);if(!f)return;
      msg('Ina-upload ang cover...');const k=await uploadCover(id,f);
      data=await getList();const t=data.find(x=>x.id===id),old=t.poster;t.poster=k;await saveList(data);if(old)delVideo(old);msg('');
    }
    if(b.dataset.a==='del'&&confirm(`Burahin ang "${d.title}"?`)){
      await Promise.all([...d.eps.map(e=>e.key),d.poster].filter(Boolean).map(delVideo));
      data=(await getList()).filter(x=>x.id!==id);await saveList(data);
    }
  }catch(err){msg(err.message)}
  render();
});

// ---- Vertical feed (swipe pataas para sa susunod na episode) ----
function openFeed(did,ei){
  const flat=[];data.forEach(d=>d.eps.forEach((e,i)=>flat.push({d,e,i})));
  const start=Math.max(0,flat.findIndex(x=>x.d.id===did&&x.i===ei));
  const f=$('feed');
  f.innerHTML='<button class="x" id="fx" aria-label="Isara">✕</button>'+flat.map((x,n)=>
    `<section class="slide" data-n="${n}"><video playsinline loop preload="none" data-src="${API}/api/video/${encodeURIComponent(x.e.key)}"></video><div class="cap"><b>${esc(x.d.title)}</b><span>Ep ${x.i+1}, ${esc(x.d.genre)}</span></div><div class="seekw"><span class="tm">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="I-forward o i-rewind"><span class="tm dur">0:00</span></div></section>`).join('');
  const fmt=t=>{t=Math.max(0,t|0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
  f.querySelectorAll('.slide').forEach(sl=>{
    const v=sl.querySelector('video'),r=sl.querySelector('.seek'),a=sl.querySelector('.tm'),b=sl.querySelector('.dur');let drag=false;
    v.addEventListener('timeupdate',()=>{if(drag||!v.duration)return;r.value=v.currentTime/v.duration*1000;a.textContent=fmt(v.currentTime)});
    v.addEventListener('loadedmetadata',()=>{b.textContent=fmt(v.duration)});
    r.addEventListener('input',()=>{drag=true;if(v.duration)a.textContent=fmt(r.value/1000*v.duration)});
    r.addEventListener('change',()=>{if(v.duration)v.currentTime=r.value/1000*v.duration;drag=false});
  });
  f.style.display='block';document.body.style.overflow='hidden';
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    const v=en.target.querySelector('video');
    if(en.isIntersecting){
      if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{});
      const nx=en.target.nextElementSibling&&en.target.nextElementSibling.querySelector('video');
      if(nx&&!nx.src){nx.preload='auto';nx.src=nx.dataset.src}
    }else v.pause();
  }),{root:f,threshold:.7});
  f.querySelectorAll('.slide').forEach(s=>io.observe(s));
  f._io=io;
  f.querySelector(`[data-n="${start}"]`).scrollIntoView();
  f.onclick=e=>{const v=e.target.closest('video');if(v)v.paused?v.play():v.pause()};
  $('fx').onclick=closeFeed;
}
function closeFeed(){
  const f=$('feed');if(f._io)f._io.disconnect();
  f.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});
  f.style.display='none';f.innerHTML='';document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFeed()});
$('add').onclick=()=>{$('frm').reset();$('bar').style.display='none';$('dlgAdd').showModal()};
$('frm').addEventListener('submit',async e=>{
  if(e.submitter.value!=='ok')return;
  e.preventDefault();
  const id='d'+Date.now(),files=[...$('v').files];
  try{
    const poster=$('p').files[0]?await uploadCover(id,$('p').files[0]):'';
    const eps=await uploadEps(id,files);
    data=await getList();
    data.unshift({id,poster,title:$('t').value.trim(),genre:$('g').value,synopsis:$('s').value.trim(),eps});
    await saveList(data);msg('Na-publish na.');setTimeout(msg,2500);
  }catch(err){msg(err.message)}
  $('dlgAdd').close();render();
});
document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  filter=b.dataset.f;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render();
});

function setAdmin(on){document.body.classList.toggle('admin',on);$('login').textContent=on?'Mag-logout':'Admin'}
$('login').onclick=async()=>{
  if(key){key='';localStorage.removeItem('adminKey');setAdmin(false);return}
  const k=prompt('Admin password:');if(!k)return;
  const r=await fetch(API+'/api/auth',{method:'POST',headers:{Authorization:'Bearer '+k}}).catch(()=>null);
  if(r&&r.ok){key=k;localStorage.setItem('adminKey',k);setAdmin(true)}else alert('Mali ang password o hindi maabot ang server.');
};
if(key)setAdmin(true);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
